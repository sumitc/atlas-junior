name: Place dictionary pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: read

jobs:
  sync:
    if: github.repository == 'sumitc/atlas-junior'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Process place requests
        run: npm run process:place-requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: sumitc/atlas-junior

      - name: Apply approved country aliases
        run: npm run apply:place-approvals

      - name: Refresh web export
        run: npm run deploy:web

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No pipeline changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/approved-country-additions.json data/place-pipeline-status.json public/places.json backend/public/game
          git commit -m "Sync place dictionary pipeline" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push
