name: Place dictionary pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh web export
        run: npm run deploy:web

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No pipeline changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/approved-country-additions.json data/place-pipeline-status.json public/places.json backend/public/game
          git commit -m "Sync place dictionary pipeline" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push
