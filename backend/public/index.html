<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atlas Junior</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #fffbeb 0%, #fdf4ff 50%, #eff6ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: rgba(255,255,255,0.85);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 8px 32px #7c3aed18;
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    .dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    h1 { font-size: 2rem; font-weight: 900; color: #0f172a; margin-bottom: 0.25rem; }
    .subtitle { color: #7c3aed; font-weight: 600; margin-bottom: 1.5rem; font-size: 0.95rem; }
    .status { color: #475569; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .status strong { color: #22c55e; }
    a { color: #7c3aed; font-size: 0.85rem; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Atlas Junior</h1>
    <p class="subtitle">Geography word game</p>
    <p class="status"><span class="dot"></span><strong>All systems operational</strong></p>
    <a href="/privacy">Privacy Policy</a>
  </div>
</body>
</html>
